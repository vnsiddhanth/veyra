# Cloudflare Workers static assets (Cloudflare's successor to Pages). The site is fully static:
# dist/ is served from the global CDN. Response headers come from dist/_headers; unknown paths fall
# back to index.html for client-side routing.
name = "veyra"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
