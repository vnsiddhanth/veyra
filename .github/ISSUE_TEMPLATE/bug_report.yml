name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or area
      placeholder: e.g. Compress video, editor timeline, export
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: About the file (if it matters)
      description: Container, codecs, resolution, duration — the Video metadata viewer shows these. Please don't attach private media.
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Copy any message shown on screen or in the browser console.
      render: text
