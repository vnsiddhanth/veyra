name: Feature request
description: Suggest a tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not just the solution — it helps us find the best design.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Veyra help?
  - type: checkboxes
    id: local
    attributes:
      label: Fits Veyra's principles
      options:
        - label: It can run entirely in the browser without uploading files
