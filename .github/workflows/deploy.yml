# Deploys the site to Cloudflare on every push to main.
# One-time setup: create a Cloudflare API token (template "Edit Cloudflare Workers") and add it to this
# repository as the secret CLOUDFLARE_API_TOKEN, and the account ID as CLOUDFLARE_ACCOUNT_ID.
# Until both secrets exist the job is skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Deploy secrets not set; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npx vitest run
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run build
        env:
          VEYRA_SITE_URL: https://veyraedit.pages.dev
      # Main address: https://veyraedit.pages.dev (Cloudflare Pages).
      - if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name veyraedit --branch main --commit-dirty=true
      # Kept in sync: https://veyra.siddhanth-n-vishnubhotla.workers.dev
      - if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
