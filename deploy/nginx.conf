# Example nginx site for a self-hosted Veyra build (copy dist/ to /var/www/veyra).
server {
  listen 443 ssl http2;
  server_name video.example.com;
  root /var/www/veyra;
  index index.html;

  # WebAssembly must be served with the right type.
  types { application/wasm wasm; }
  include /etc/nginx/mime.types;

  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    try_files $uri /index.html;
  }
}
